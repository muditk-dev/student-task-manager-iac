name: Deploy Serverless Student Task Manager

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-deploy:
    name: Terraform IaC Lifecycle & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Run Tests
        working-directory: .
        run: |
          npm test

      - name: Set up HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: "Step 13: Terraform Format Check"
        run: terraform fmt -check

      - name: "Step 12: Terraform Init"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform init

      - name: "Step 14: Terraform Validate"
        run: terraform validate

      - name: Verify Cloudflare Credentials in Secrets
        id: check-secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::warning::Cloudflare secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) are not configured in GitHub Secrets. Skipping plan and deploy steps until configured."
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: "Restore Terraform State Cache"
        if: steps.check-secrets.outputs.has_credentials == 'true'
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            terraform-state-${{ github.ref_name }}-

      - name: "Sync State for Existing Cloudflare Resources"
        if: steps.check-secrets.outputs.has_credentials == 'true'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform state show cloudflare_workers_kv_namespace.student_tasks || \
            terraform import -input=false cloudflare_workers_kv_namespace.student_tasks "$TF_VAR_account_id/e1380c1858ff4097b9ad8645c7896dc3" || true
          terraform state show cloudflare_workers_script.student_task_manager || \
            terraform import -input=false cloudflare_workers_script.student_task_manager "$TF_VAR_account_id/student-task-manager" || true

      - name: "Step 15: Terraform Plan"
        id: plan
        if: steps.check-secrets.outputs.has_credentials == 'true'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform plan -out=tfplan -input=false

      - name: "Step 16: Terraform Apply (Deploy on Push)"
        if: steps.check-secrets.outputs.has_credentials == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform apply -input=false tfplan
          terraform output
